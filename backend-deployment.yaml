apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app-deployment
  labels:
    app: backend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      containers:
        - name: backend-app
          image: honzafoniok/backend-app:v2
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_ADDR
              value: "redis-service:6379"
      imagePullSecrets:
        - name: my-secret
